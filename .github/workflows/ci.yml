name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Integration tests run against a real SQL Server engine (never the EF in-memory provider).
      # The container is ephemeral and private to this job, so a per-run password is fine.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-Pw!1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore Harmonee.slnx

      - name: Build
        run: dotnet build Harmonee.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format Harmonee.slnx --verify-no-changes --no-restore

      - name: Test
        env:
          HARMONEE_TEST_SQL: Server=localhost,1433;User ID=sa;Password=Ci-${{ github.run_id }}-Pw!1;TrustServerCertificate=True
        run: >
          dotnet test --solution Harmonee.slnx --configuration Release --no-build
          --coverage --coverage-output-format cobertura --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
